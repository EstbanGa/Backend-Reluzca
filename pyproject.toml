[project]
name = "reluzca-backend"
version = "1.0.0"
description = "Backend FastAPI para Reluzca - Sistema de gestión de servicios de limpieza"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Reluzca Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
]
